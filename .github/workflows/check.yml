name: Check setup
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - if: runner.os == 'Linux'
        run: sh -n install.sh
      - if: runner.os == 'Windows'
        shell: powershell
        run: ./launcher/windows/build.ps1
